<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login - OKC Portal</title>
    <style>
        body {font-family: Arial; padding: 50px; background: #f0f0f0;}
        .login-box {background: white; padding: 30px; width: 300px; margin: auto; border-radius: 10px;}
    </style>
</head>
<body>
<div class="login-box">
<h2>Teacher Login</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Log in</button>
</form>
</div>
</body>
</html>
