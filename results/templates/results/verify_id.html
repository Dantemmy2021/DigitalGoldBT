<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify ID</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light p-3 text-center">
<div class="card mx-auto" style="max-width:380px;">
  <div class="card-body">
    {% if school.logo %}<img src="{{ school.logo.url }}" style="width:60px; height:60px; border-radius:50%; object-fit:contain;" class="mb-2">{% endif %}
    <h6>{{ school.name }}</h6>
    {% if student.photo %}<img src="{{ student.photo.url }}" style="width:120px; height:140px; object-fit:cover; border-radius:8px;" class="my-2">{% endif %}
    <h5>{{ student.full_name }}</h5>
    <p class="mb-1"><b>{{ student.admission_no }}</b> • {{ student.student_class.name }} {{ student.student_class.arm }}</p>
    <span class="badge bg-success">✓ VERIFIED STUDENT - {{ school.current_session }}</span>
    <p class="text-muted small mt-2">Verified at {% now "d M Y h:i A" %}</p>
  </div>
</div>
</body>
</html>
