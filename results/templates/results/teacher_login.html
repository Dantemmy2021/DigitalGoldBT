{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
.login-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
    padding: 20px;
}
.login-container {
    max-width: 420px;
    width: 100%;
    padding: 35px 30px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    background: white;
    text-align: center;
    border-top: 4px solid {{school.primary_color}};
}
.school-logo {
    max-width: 100px;
    max-height: 100px;
    object-fit: contain;
    margin-bottom: 15px;
}
.login-container h2 {
    color: {{school.primary_color}};
    margin-bottom: 5px;
}
.form-group { text-align: left; margin-bottom: 18px; }
.form-group label { font-weight: bold; display: block; margin-bottom: 6px; }
.form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}
.btn-login {
    width: 100%;
    padding: 12px;
    background: {{school.primary_color}};
    color: white;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}
.alert { padding:10px; background:#f8d7da; border-radius:4px; margin-bottom:15px; color:#721c24; }
</style>

<div class="login-wrapper">
    <div class="login-container">
        {% if school.logo %}
            <img src="{{ school.logo.url }}" alt="{{ school.name }} Logo" class="school-logo">
        {% endif %}
        
        <h2>Teacher Login</h2>
        <p style="color:#666; margin-bottom:20px;">{{ school.name }}</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username:</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <a href="{% url 'results:portal_login' school_slug=school.slug %}" style="display:block; margin-top:15px; color:{{ school.primary_color }};">Back</a>
    </div>
</div>
{% endblock %}
