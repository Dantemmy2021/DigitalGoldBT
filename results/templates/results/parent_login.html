<!DOCTYPE html>
<html lang="en">
<head>
  <title>Check Result - {{ school.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --primary: {{ school.primary_color|default:"#0d6efd" }}; }
    .btn-primary { background: var(--primary); border: none; }
    .btn-primary:hover { background: var(--primary); opacity: 0.9; }
    .card-header { background: var(--primary); }
    .school-logo { max-height: 90px; max-width: 120px; object-fit: contain; }
  </style>
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-header text-center text-white py-3">
          
          <!-- LOGO ADDED HERE -->
          {% if school.logo %}
            <img src="{{ school.logo.url }}" alt="{{ school.name }} Logo" class="school-logo mb-2">
          {% endif %}
          
          <h3 class="mb-0">Check Result</h3>
          <p class="mb-0">{{ school.name }}</p>
          <small>{{ school.current_term }} {{ school.current_session }}</small>
        </div>
        <div class="card-body p-4">
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
          
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Admission Number</label>
              <input type="text" name="student_id" class="form-control" placeholder="e.g. AG/001" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Scratch Card PIN / Access Code</label>
              <input type="password" name="access_code" class="form-control" placeholder="Enter PIN from card" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">View Result</button>
          </form>
          <a href="{% url 'school_landing_main' school_slug=school.slug %}" class="btn btn-link w-100 mt-2">← Back to Home</a>
        </div>
      </div>
      <p class="text-center text-muted mt-3" style="font-size:12px;">
        Powered by OKC Portal
      </p>
    </div>
  </div>
</div>
</body>
</html>
