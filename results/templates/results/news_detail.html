<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ news_item.title }} - {{ school.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>:root{--primary: {{ school.primary_color|default:"#0d6efd" }};} .navbar{background:var(--primary);} </style>
</head>
<body>
<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold text-white" href="{% url 'school_landing_main' school.slug %}"><i class="bi bi-arrow-left"></i> Back to {{ school.name }}</a>
  </div>
</nav>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <small class="text-muted"><i class="bi bi-calendar"></i> {{ news_item.date_posted|date:"F d, Y" }}</small>
      <h1 class="fw-bold mt-2 mb-4" style="color:var(--primary);">{{ news_item.title }}</h1>
      <div class="card p-4 shadow-sm">
        <p style="white-space: pre-line; line-height:1.8; font-size:1.1rem;">{{ news_item.content }}</p>
      </div>
      <a href="{% url 'school_landing_main' school.slug %}#news" class="btn btn-outline-secondary mt-4"><i class="bi bi-arrow-left"></i> Back to News</a>
    </div>
  </div>
</div>
</body>
</html>
